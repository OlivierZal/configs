sonar.projectKey=OlivierZal_configs
sonar.organization=olivierzal
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
# `tests/fixtures` holds TEXT the tests read — inputs shaped on purpose
# (invalid configs, kernel sources), not code — so neither the platform's
# gate nor the house bar judges it, exactly as `eslint.config.ts` ignores it.
sonar.exclusions=tests/fixtures/**
sonar.coverage.exclusions=tests/**,**/*.config.*
sonar.cpd.exclusions=**/*.config.*
sonar.sourceEncoding=UTF-8
