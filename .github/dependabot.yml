updates:
  # Both ecosystems share the `build(deps)` type: it keeps every bump under
  # one `git log --grep` and leaves `ci` to mean hand-written CI changes.
  # The prefix is pinned rather than left to Dependabot, which otherwise
  # infers it from each repo's history and lands a different one per repo.
  # The case of the subject's first word cannot be pinned (`commit-message`
  # takes `prefix`, `prefix-development` and `include` only) and follows
  # that history: `Bump` in api-core and melcloud-api, `bump` elsewhere.
  - commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    # `/` reaches `.github/workflows` and a root `action.yml` only. The
    # composite action every job of the family runs is named beside it,
    # or the pins it holds are never proposed.
    directories:
      - /
      - /.github/actions/setup-node-and-install
    groups:
      actions:
        patterns:
          - '*'
    package-ecosystem: github-actions
    schedule:
      interval: weekly
  - commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    directory: /
    groups:
      eslint:
        patterns:
          - '@eslint/*'
          - '@html-eslint/*'
          - '@stylistic/*'
          - eslint
          - eslint-*
          - typescript-eslint
      minor-and-patch:
        exclude-patterns:
          - '@eslint/*'
          - '@html-eslint/*'
          - '@stylistic/*'
          - '@vitest/*'
          - eslint
          - eslint-*
          - typescript-eslint
          - vitest
        update-types:
          - minor
          - patch
      vitest:
        patterns:
          - '@vitest/*'
          - vitest
    # typescript-eslint is held at 8.72. From 8.73 its parser asks, as an
    # optional peer, for a TypeScript 7.1 under the name the 6/7 layout
    # gives the 7.0 compiler, and npm settles that with a nightly
    # (`src/eslint/audited-versions.ts` has the measurement). The entry
    # goes the day `@typescript/native` is a 7.1 here: the ledger's suite
    # fails that day, and fails too if this goes first.
    ignore:
      - dependency-name: typescript-eslint
        versions:
          - '>=8.73.0'
    package-ecosystem: npm
    schedule:
      interval: weekly
version: 2
