jobs:
  claude:
    if: |
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body || '', '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    name: Claude
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@e8c2d7c16c018cf1e694711c1c07a5f5db2b5eb1 # v1.0.208
        with:
          additional_permissions: |
            actions: read
          claude_args: --model opus
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    timeout-minutes: 15
name: Claude
on:
  # No pull_request_review(_comment): Copilot auto-review fires them as a
  # write-less bot, piling up held runs the if-guard would skip anyway.
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
permissions: {}
