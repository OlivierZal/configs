jobs:
  claude:
    if: |
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.comment.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body || '', '@claude') ||
            contains(github.event.issue.title, '@claude')) &&
          contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'),
            github.event.issue.author_association))
      )
    name: Claude
    permissions:
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          additional_permissions: |
            actions: read
          # The permission mode is STATED, never left to the action's
          # default: claude-code-action 1.0.273 starts a session in
          # `auto` mode when no mode is given, where 1.0.271 passed
          # `acceptEdits` in mention mode. The workflow's flag comes
          # last and wins, so the pin can move without the posture
          # moving with it; taking `auto` is a decision, made here.
          claude_args: --model opus --permission-mode acceptEdits
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    timeout-minutes: 15
name: Claude
on:
  # No pull_request_review(_comment): Copilot auto-review fires them as a
  # write-less bot, piling up held runs the if-guard would skip anyway.
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
permissions: {}
