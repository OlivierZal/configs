# The family audit shape, callable. Serialized per ref without
# cancelling in-progress audits — an interrupted audit reports nothing.
concurrency:
  cancel-in-progress: false
  group: audit-${{ github.ref }}
jobs:
  audit:
    name: Audit
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `npm audit` itself reads only the lockfile, but the verifier below
      # ships inside the package — so this job installs. Skipping the
      # install left the primary path missing and silently fell through to
      # the `scripts/` copy, which exists only in this repo: the gate ran
      # green here and could not run at all in any caller.
      - uses: ./.github/actions/setup-node-and-install
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # `--omit=dev` is the whole point: only what reaches the device
      # counts. The report is written rather than piped because npm exits
      # non-zero exactly when it finds something — a pipeline would
      # conflate "found advisories" with "could not run", and the check
      # must never read a clean verdict out of a failed run. Hence
      # `|| true` here and every honesty test inside the script.
      - name: Collect the production audit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm audit --omit=dev --json > audit.json || true
      - name: Verify the production audit
        env:
          AUDIT_EXCEPTIONS: ${{ inputs.audit-exceptions }}
          AUDIT_LEVEL: ${{ inputs.audit-level }}
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-production-audit.sh
          [ -f "$script" ] || script=scripts/check-production-audit.sh
          bash "$script" audit.json "$AUDIT_LEVEL" "$AUDIT_EXCEPTIONS"
    timeout-minutes: 15
name: Reusable Audit
on:
  workflow_call:
    inputs:
      # One `GHSA-…` id per line followed by the reason it is tolerated,
      # e.g. `GHSA-xxxx-xxxx-xxxx — reached only through <path>; upstream
      # <package> pins the vulnerable major`. A reason is mandatory, an
      # id that no longer appears in the report fails as loudly as an
      # unnamed advisory, and the ids are per-advisory rather than
      # per-package so a new finding in the same dependency still fails.
      audit-exceptions:
        default: ''
        required: false
        type: string
      # Every advisory at or above this floor must be fixed or recorded
      # in `audit-exceptions`. `low` rather than `high` because the
      # exception list, not the threshold, is what keeps the signal
      # quiet — a raised floor hides findings without recording that
      # anyone looked at them.
      audit-level:
        default: low
        required: false
        type: string
permissions: {}
