# The family audit shape, callable. Serialized per ref without
# cancelling in-progress audits — an interrupted audit reports nothing.
concurrency:
  cancel-in-progress: false
  group: audit-${{ github.ref }}
jobs:
  audit:
    name: Audit
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          install: 'false'
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm audit --audit-level=high --omit=dev
    timeout-minutes: 15
name: Reusable Audit
on:
  workflow_call: {}
permissions: {}
