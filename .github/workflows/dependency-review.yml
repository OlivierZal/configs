concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: dependency-review-${{ github.ref }}
jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # `runtime` alone: only what reaches the device counts, and the
      # scope comes from the dependency graph rather than from a flag we
      # maintain. `low` because a raised floor hides findings without
      # recording that anyone looked. Both are the action's current
      # defaults, written out because a default that moves would move the
      # contract silently. No `comment-summary-in-pr`: it would require
      # `pull-requests: write`, and the run summary already carries the
      # table the comment would duplicate.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-scopes: runtime
          fail-on-severity: low
    timeout-minutes: 15
name: Dependency review
# Diff-shaped by construction: the action compares a base ref against a
# head ref, so it belongs to pull requests and nowhere else. No `push`,
# which has no base to compare. What a pull request cannot see — an advisory that landed
# before it — is Dependabot's continuous job, not this one's.
on:
  pull_request: {}
  workflow_call: {}
permissions: {}
