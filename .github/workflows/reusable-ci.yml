# The family CI shape, callable: check job (typecheck/lint/format plus
# the optional library gates) and a three-leg test matrix whose
# coverage/Sonar leg is chosen by the caller. Permissions are the
# family superset — packages:read is inert for repos without scoped
# dependencies.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ci-${{ github.ref }}
jobs:
  check:
    name: Check
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ inputs.check-node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # The pin verifier ships inside the package, so it is always the
      # version the `@olivierzal/configs` pin names — the one this repo
      # hosts rather than installs.
      - name: Verify action pins
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-pins.sh
          [ -f "$script" ] || script=scripts/check-pins.sh
          bash "$script"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - if: inputs.run-docs
        run: npm run docs
      - if: inputs.run-lint-package
        run: npm run lint:package
    timeout-minutes: 15
  test:
    # `latest` tracks brand-new Node releases; continue-on-error keeps
    # the workflow run green when that leg breaks. The check run itself
    # still reports failure, so keep `Test (Node latest)` out of the
    # required status checks or it will still block merges.
    continue-on-error: ${{ matrix.node-version == 'latest' }}
    # Job-level so the Sonar step can gate on the secret's presence: the
    # `secrets` context is not available in a step-level `if`, `env` is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    name: Test (Node ${{ matrix.node-version }})
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # Coverage (and the Sonar upload that consumes it) runs once, on
      # the caller-chosen leg, which stays blocking so the quality gate
      # cannot be skipped silently.
      - if: matrix.node-version == inputs.coverage-node-version
        run: npm test -- --coverage
      - if: matrix.node-version != inputs.coverage-node-version
        run: npm test
      # Self-armed on the secret: until SONAR_TOKEN is provisioned the
      # upload skips instead of failing the leg.
      - if: matrix.node-version == inputs.coverage-node-version && env.SONAR_TOKEN != '' && (github.event_name == 'push' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, latest, 'lts/*']
    timeout-minutes: 20
name: Reusable CI
on:
  workflow_call:
    inputs:
      check-node-version:
        default: lts/*
        required: false
        type: string
      coverage-node-version:
        default: lts/*
        required: false
        type: string
      run-docs:
        default: false
        required: false
        type: boolean
      run-lint-package:
        default: false
        required: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
permissions: {}
