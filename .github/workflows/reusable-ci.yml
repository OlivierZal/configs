# The family CI shape, callable: check job (typecheck/lint/format plus
# the optional library gates), a test matrix whose legs and whose
# coverage/Sonar leg are both chosen by the caller — a repo whose
# runtime floor is a specific minor pins that minor here rather than
# floating with `lts/*` — and the Sonar job that holds the house bar on
# what that leg uploaded. Permissions are the family superset —
# packages:read is inert for repos without scoped dependencies.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ci-${{ github.ref }}
jobs:
  check:
    name: Check
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ inputs.check-node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # The coverage leg is selected by string equality against the
      # matrix, so a version no leg carries selects nothing and the
      # quality gate quietly stops running behind green legs. This job
      # is a required context everywhere, which is what makes the
      # mistake unmissable rather than merely detected.
      - name: Verify the coverage leg
        env:
          COVERAGE_NODE_VERSION: ${{ inputs.coverage-node-version }}
          NODE_VERSIONS: ${{ inputs.node-versions }}
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-coverage-leg.sh
          [ -f "$script" ] || script=scripts/check-coverage-leg.sh
          bash "$script" "$NODE_VERSIONS" "$COVERAGE_NODE_VERSION"
      # The pin verifier ships inside the package, so it is always the
      # version the `@olivierzal/configs` pin names — the one this repo
      # hosts rather than installs.
      - name: Verify action pins
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-pins.sh
          [ -f "$script" ] || script=scripts/check-pins.sh
          bash "$script"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - if: inputs.run-docs
        run: npm run docs
      - if: inputs.run-lint-package
        run: npm run lint:package
    timeout-minutes: 15
  sonar:
    # The house bar is stricter than the free-tier quality gate, which
    # tolerates 3 % duplication on new code, lets code smells through
    # and cannot be customized. So this reads the metrics themselves,
    # both windows, and treats anything it could not read as a failure —
    # a gate that greens what it did not verify is worse than none.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    name: Sonar
    # The analysis this verifies is uploaded by the coverage leg.
    needs: test
    permissions:
      contents: read
      packages: read
      pull-requests: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ inputs.check-node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the Sonar bar
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THIS_REPO: ${{ github.repository }}
        # The two lists are what makes the unanalysed-pull-request branch
        # a verification instead of an assumption, so they are read from
        # the API rather than inferred from the actor.
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$PR_NUMBER" ]; then
            COMMIT_AUTHORS=$(gh api "repos/$THIS_REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.[].author.login // .commit.author.name')
            CHANGED_FILES=$(gh api "repos/$THIS_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
            export COMMIT_AUTHORS CHANGED_FILES
          fi
          script=node_modules/@olivierzal/configs/scripts/check-sonar-gate.sh
          [ -f "$script" ] || script=scripts/check-sonar-gate.sh
          bash "$script"
    timeout-minutes: 15
  test:
    # `latest` tracks brand-new Node releases; continue-on-error keeps
    # the workflow run green when that leg breaks. The check run itself
    # still reports failure, so keep `Test (Node latest)` out of the
    # required status checks or it will still block merges.
    continue-on-error: ${{ matrix.node-version == 'latest' }}
    # Job-level so the Sonar step can gate on the secret's presence: the
    # `secrets` context is not available in a step-level `if`, `env` is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    name: Test (Node ${{ matrix.node-version }})
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # Coverage (and the Sonar upload that consumes it) runs once, on
      # the caller-chosen leg, which stays blocking. That the leg exists
      # at all is the check job's guard, not this comparison: a version
      # outside the matrix would match nothing here and skip both.
      - if: matrix.node-version == inputs.coverage-node-version
        run: npm test -- --coverage
      - if: matrix.node-version != inputs.coverage-node-version
        run: npm test
      # Self-armed on the secret: until SONAR_TOKEN is provisioned the
      # upload skips instead of failing the leg.
      - if: matrix.node-version == inputs.coverage-node-version && env.SONAR_TOKEN != '' && (github.event_name == 'push' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions) }}
    timeout-minutes: 20
name: Reusable CI
on:
  workflow_call:
    inputs:
      check-node-version:
        default: lts/*
        required: false
        type: string
      coverage-node-version:
        default: lts/*
        required: false
        type: string
      # Quoted entries only, and the check job enforces it: `22.20` is
      # JSON for the number 22.2, so it would install the 22.2 line and
      # be compared as `"22.2"` — a wrong runtime and a skipped
      # coverage leg from one missing pair of quotes. Every entry names
      # a required status check (`Test (Node <entry>)`), so changing
      # this list means updating the caller's ruleset in the same move.
      node-versions:
        default: '["22", "latest", "lts/*"]'
        required: false
        type: string
      run-docs:
        default: false
        required: false
        type: boolean
      run-lint-package:
        default: false
        required: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
permissions: {}
