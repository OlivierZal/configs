# The family CI shape, callable: check job (typecheck/lint/format plus
# the optional library gates), a test matrix the caller describes leg by
# leg — a repo whose runtime floor is a specific minor pins that minor
# here rather than floating with `lts/*` — and the Sonar job that holds
# the house bar on what the coverage leg uploaded. Permissions are the
# family superset — packages:read is inert for repos without scoped
# dependencies.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ci-${{ github.ref }}
jobs:
  check:
    name: Check
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ inputs.check-node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # No flagged leg means no coverage and no Sonar upload, behind legs
      # that stay green — the one way left to misstate the matrix that
      # says nothing. This job is a required context everywhere, which is
      # what makes it unmissable rather than merely detected.
      - name: Verify the coverage leg
        env:
          NODE_VERSIONS: ${{ inputs.node-versions }}
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-coverage-leg.sh
          [ -f "$script" ] || script=scripts/check-coverage-leg.sh
          bash "$script" "$NODE_VERSIONS"
      # The pin verifier ships inside the package, so it is always the
      # version the `@olivierzal/configs` pin names — the one this repo
      # hosts rather than installs.
      - name: Verify action pins
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-pins.sh
          [ -f "$script" ] || script=scripts/check-pins.sh
          bash "$script"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - if: inputs.run-docs
        run: npm run docs
      - if: inputs.run-lint-package
        run: npm run lint:package
    timeout-minutes: 15
  sonar:
    # The house bar is stricter than the free-tier quality gate, which
    # tolerates 3 % duplication on new code, lets code smells through
    # and cannot be customized. So this reads the metrics themselves,
    # both windows, and treats anything it could not read as a failure —
    # a gate that greens what it did not verify is worse than none.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    name: Sonar
    # The analysis this verifies is uploaded by the coverage leg.
    needs: test
    # No more than the callers grant: a called job asking for a
    # permission its caller withholds fails the whole run at startup,
    # so the two lists below come from git rather than from the pulls
    # API, which would have cost every caller a `pull-requests: read`.
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of the merge commit, which is what the two lists
          # below are read from.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ inputs.check-node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the Sonar bar
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          THIS_REPO: ${{ github.repository }}
        # The two lists are what makes the unanalysed-pull-request branch
        # a verification instead of an assumption. Read from the merge
        # commit's two sides: the authorship that actually lands in
        # history, not a label attached to the pull request.
        run: |
          if git rev-parse -q --verify HEAD^2 >/dev/null; then
            COMMIT_AUTHORS=$(git log --format='%an' HEAD^2 --not HEAD^1)
            CHANGED_FILES=$(git diff --name-only HEAD^1 HEAD^2)
            export COMMIT_AUTHORS CHANGED_FILES
          fi
          script=node_modules/@olivierzal/configs/scripts/check-sonar-gate.sh
          [ -f "$script" ] || script=scripts/check-sonar-gate.sh
          bash "$script"
    timeout-minutes: 15
  test:
    # `latest` tracks brand-new Node releases; continue-on-error keeps
    # the workflow run green when that leg breaks. The check run itself
    # still reports failure, so keep `Test (Node latest)` out of the
    # required status checks or it will still block merges.
    continue-on-error: ${{ matrix.node-version == 'latest' }}
    # Job-level so the Sonar step can gate on the secret's presence: the
    # `secrets` context is not available in a step-level `if`, `env` is.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    name: Test (Node ${{ matrix.node-version }})
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          node-version: ${{ matrix.node-version }}
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # Coverage (and the Sonar upload that consumes it) runs once, on
      # the leg the caller flagged. The flag travels with the leg it
      # marks, so it cannot name one that does not exist.
      - if: matrix.coverage
        run: npm test -- --coverage
      - if: ${{ !matrix.coverage }}
        run: npm test
      # Self-armed on the secret: until SONAR_TOKEN is provisioned the
      # upload skips instead of failing the leg.
      - if: matrix.coverage && env.SONAR_TOKEN != '' && (github.event_name == 'push' || (github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository))
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
    strategy:
      fail-fast: false
      # `include` alone defines the matrix: with no base variable to
      # merge into, each entry becomes its own combination.
      matrix:
        include: ${{ fromJSON(inputs.node-versions) }}
    timeout-minutes: 20
name: Reusable CI
on:
  workflow_call:
    inputs:
      check-node-version:
        default: lts/*
        required: false
        type: string
      # One object per leg: `node-version`, and `coverage: true` on the
      # single leg that runs coverage and uploads to Sonar. Quote every
      # version — `22.20` unquoted is JSON for the number 22.2, which
      # installs the 22.2 line and names the leg `Test (Node 22.2)`.
      # Every entry names a required status check (`Test (Node
      # <version>)`), so changing this list means updating the caller's
      # ruleset in the same move.
      node-versions:
        default: '[{"node-version": "22", "coverage": true}, {"node-version": "latest"}, {"node-version": "lts/*"}]'
        required: false
        type: string
      run-docs:
        default: false
        required: false
        type: boolean
      run-lint-package:
        default: false
        required: false
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false
permissions: {}
