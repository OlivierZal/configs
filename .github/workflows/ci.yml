# Dogfoods this repo's own reusable CI.
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    # Named rather than inherited: this repo hosts the reusable
    # workflows the six others call, so a blanket `inherit` here would
    # hand every repository secret to a called workflow — the shape a
    # supply-chain attack needs. The reusable CI declares exactly one.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions: {}
