# Dogfoods this repo's own reusable CI.
jobs:
  ci:
    permissions:
      contents: read
      packages: read
    # Named rather than inherited: this repo hosts the reusable
    # workflows every other repo in the family calls, so a blanket
    # `inherit` here would hand every repository secret to a called
    # workflow — the shape a supply-chain attack needs. The reusable CI
    # declares exactly one.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    uses: $/.github/workflows/reusable-ci.yml
    with:
      run-lint-package: true
name: CI
on:
  pull_request: {}
  push:
    branches: [main]
  # A merge the Dependabot lane performs is pushed with the repository's
  # GITHUB_TOKEN and raises no workflow: the tree it leaves on `main` is
  # built, tested and analysed by this daily run, and no longer by
  # whichever push happens to follow.
  schedule:
    - cron: '23 4 * * *'
permissions: {}
