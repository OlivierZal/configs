# The published libraries' release pipeline, callable: pack, attest the
# tarball's provenance, publish it to GitHub Packages. Derived from the
# four identical publish.yml files the libraries carried (2026-09-07) —
# the same job, steps and pins, with `workflow_call` in place of the
# release trigger the caller keeps, minus an `IS_PRERELEASE` env entry
# nothing read. The `npm` environment and the
# `id-token: write` the attestation needs travel with the job; the
# caller grants them and nothing more. This repo's own publish.yml calls
# it through `./`, so the path runs here on every release of this
# package — the one release-only reusable a run from this repo can
# exercise (CLAUDE.md, the reusable-workflow blind spot).
concurrency:
  cancel-in-progress: false
  group: publish
jobs:
  publish:
    environment: npm
    name: Publish package to GitHub Packages
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-and-install
        with:
          cache: none
          # The install pulls @olivierzal packages from GitHub Packages,
          # which requires auth even for read.
          npm-token: ${{ secrets.GITHUB_TOKEN }}
          registry-url: https://npm.pkg.github.com
          scope: '@olivierzal'
      # Publish the exact tarball we attest.
      - run: npm pack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.tgz'
      # The expression decides the dist-tag before the shell runs: a
      # boolean from the release event, not text that could inject.
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish *.tgz ${{ github.event.release.prerelease && '--tag next' || '' }}
    timeout-minutes: 15
name: Reusable publish
on:
  workflow_call: {}
permissions: {}
