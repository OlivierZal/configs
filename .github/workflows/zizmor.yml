concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: zizmor-${{ github.ref }}
jobs:
  zizmor:
    name: Zizmor
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      # Audit the real CI surface only: `tests/fixtures/` holds workflow
      # files that exist to be judged by this repo's own pin check, and
      # their deliberately fake actions have no upstream to resolve.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/
    timeout-minutes: 15
name: Zizmor
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}
permissions: {}
