# The published libraries' documentation pipeline, callable: build the
# typedoc site and deploy it to GitHub Pages. Derived from the four
# identical docs.yml files the libraries carried (2026-09-07) — the same
# jobs, steps and pins, with `workflow_call` in place of the release
# trigger the caller keeps. The `github-pages` environment and the
# `id-token: write` the deployment needs travel with the deploy job;
# the caller grants them and nothing more.
#
# `dry-run` builds and packs the site without deploying it: the one
# rehearsal a release-only path can get. A caller dispatches it by hand
# and watches the build half succeed on the reusable before a release
# ever reaches the deploy half (CLAUDE.md, the reusable-workflow blind
# spot — no run from this repo exercises these jobs, which document
# nothing). That half starts on the release guard, which the dry run
# therefore proves in the caller, under the caller's own token, before
# a release depends on it.
concurrency:
  cancel-in-progress: false
  group: pages
jobs:
  build:
    name: Build docs
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The install pulls @olivierzal packages from GitHub Packages,
      # which requires auth even for read.
      - uses: $/.github/actions/setup-node-and-install
        with:
          npm-token: ${{ secrets.GITHUB_TOKEN }}
      # A release publishes its documentation as it publishes its
      # package, from a commit its CI has judged (reusable-publish.yml
      # holds the same step). Unconditional, so that a dry run rehearses
      # it: dispatched on the default branch, it judges that branch's
      # head, and from a tag, the commit a release would.
      - env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          THIS_REPO: ${{ github.repository }}
        run: |
          script=node_modules/@olivierzal/configs/scripts/check-release.sh
          [ -f "$script" ] || script=scripts/check-release.sh
          bash "$script"
      - run: npm run build
      - run: npm run docs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
    timeout-minutes: 15
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ !inputs.dry-run }}
    name: Deploy docs
    needs: build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
    timeout-minutes: 10
name: Reusable docs
on:
  workflow_call:
    inputs:
      # Build and pack without deploying — a rehearsal of the release
      # path from a manual dispatch, the only run that can prove the
      # build half before a release reaches the deploy half.
      dry-run:
        default: false
        required: false
        type: boolean
permissions: {}
