# Dogfoods this repo's own reusable publish, the way ci.yml does for the
# reusable CI: the release path every library calls runs here first,
# resolved from the same commit through the local `./` reference.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/reusable-publish.yml
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
