jobs:
  review:
    # Job-level so a fully-skipped bot-triggered run cannot claim the
    # group and cancel an in-progress human review.
    concurrency:
      cancel-in-progress: true
      group: claude-review-${{ github.event.pull_request.number }}
    if: |
      github.actor != 'claude[bot]' &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Review
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # The permission mode is STATED, never left to the action's
          # default: claude-code-action 1.0.273 starts a session in
          # `auto` mode when no mode is given, where 1.0.271 passed
          # none in prompt mode. The workflow's flag comes last and
          # wins, so the pin can move without the posture moving with
          # it; taking `auto` is a decision, made on this line.
          claude_args: --model opus --permission-mode default
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review ${{ github.repository }}/pull/${{
            github.event.pull_request.number }}
          # One auto-updated comment per PR: without it a clean review
          # leaves no trace on the PR (the report only reaches the run's
          # step summary, and inline comments only fire on findings).
          use_sticky_comment: true
    timeout-minutes: 20
name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
permissions: {}
